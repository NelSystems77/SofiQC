<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Quest Climate Practice</title>
<meta name="description" content="Interactive practice for 3rd grade Science Quiz 2: Climate Change, Greenhouse Effect and Natural vs Human Factors.">
<meta name="theme-color" content="#bfe6ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='38' fill='%23fff' stroke='%239fd3ff' stroke-width='6'/%3E%3Ccircle cx='38' cy='52' r='5' fill='%233a6ea5'/%3E%3Ccircle cx='62' cy='52' r='5' fill='%233a6ea5'/%3E%3Cellipse cx='30' cy='65' rx='7' ry='4' fill='%23ffb8d1'/%3E%3Cellipse cx='70' cy='65' rx='7' ry='4' fill='%23ffb8d1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#d9f0ff; --sky2:#bfe6ff; --sky3:#f4e9ff;
  --ink:#1d3557; --ink-soft:#44628a;
  --blue:#2764c5; --blue-d:#1b4a9a; --blue-l:#e3f1ff; --line:#b9d9f5;
  --pink:#ff9ec1; --pink-l:#ffe6ef; --pink-d:#b8305f;
  --ok:#17663f; --ok-bg:#e1f7ea; --bad:#a5214f; --bad-bg:#ffe3ec;
  --card:#ffffffee; --shadow:0 8px 24px #4a86c533;
  --r:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;color:var(--ink);font-size:18px;line-height:1.5;
  background:linear-gradient(180deg,var(--sky2) 0%,var(--sky1) 45%,var(--sky3) 100%) fixed;min-height:100vh;overflow-x:hidden}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:10px 16px;border-radius:12px;z-index:100;font-weight:800}
.skip:focus{left:8px}
:focus-visible{outline:4px solid #ff7aa8;outline-offset:3px;border-radius:10px}
/* sky decor */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:100px;opacity:.85;filter:drop-shadow(0 6px 10px #6aa9e033);animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:50%;height:160%;left:14%;top:-70%}
.cloud:after{width:38%;height:130%;right:14%;top:-45%}
.c1{width:160px;height:44px;top:9%;left:-200px;animation-duration:70s}
.c2{width:110px;height:32px;top:34%;left:-200px;animation-duration:95s;animation-delay:-30s;opacity:.7}
.c3{width:210px;height:56px;top:68%;left:-260px;animation-duration:120s;animation-delay:-60s;opacity:.6}
@keyframes drift{to{transform:translateX(calc(100vw + 480px))}}
.star{position:absolute;color:#fff;font-size:22px;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.25;transform:scale(.8) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* layout */
header.top,main,footer{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;gap:14px;padding-top:18px;padding-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:left;padding:4px;border-radius:16px}
.brand svg{width:64px;height:64px;flex:none}
.brand b{display:block;font-size:1.45rem;font-weight:900;line-height:1.1}
.brand small{color:var(--ink-soft);font-weight:700}
.countdown{margin-left:auto;background:var(--pink-l);border:2px solid var(--pink);border-radius:999px;padding:6px 16px;font-weight:800;font-size:.95rem}
main{padding-top:10px;padding-bottom:40px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .4em}
h1{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:900}
h2{font-size:1.5rem;font-weight:900}
h3{font-size:1.15rem;font-weight:800}
.card{background:var(--card);border:2px solid #fff;border-radius:var(--r);box-shadow:var(--shadow);padding:20px;backdrop-filter:blur(4px)}
.stack>*+*{margin-top:16px}
.hello{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 16px;font-weight:700;flex:1;min-width:220px}
.bubble:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--line);border-left:0}
.hello svg{width:96px;height:96px;flex:none;animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:12px 24px;min-height:48px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d);transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-d)}
.btn.alt{background:#fff;color:var(--blue-d);border:3px solid var(--blue);box-shadow:0 4px 0 var(--line)}
.btn.pink{background:var(--pink-d);box-shadow:0 4px 0 #7d1f40}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.progress{height:16px;background:#fff;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#7cc4ff,#ff9ec1);border-radius:999px;transition:width .4s}
/* path map */
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;list-style:none;padding:0;margin:0}
.step{display:flex;flex-direction:column;gap:6px}
.step .num{width:44px;height:44px;border-radius:50%;background:var(--blue-l);border:3px solid var(--blue);display:grid;place-items:center;font-weight:900;color:var(--blue-d)}
.step .tag{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--pink-d)}
.step p{margin:0;color:var(--ink-soft);font-size:.95rem;flex:1}
.stars{font-size:1.3rem;letter-spacing:2px;color:#e7a400}
.stars .off{color:#c9d7e8}
.best{font-weight:800;font-size:.9rem}
/* study */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-weight:800;padding:10px 18px;border-radius:999px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:46px}
.tab[aria-selected=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.pill{display:inline-block;background:var(--blue-l);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:800;margin:2px 4px 2px 0}
.pill.p{background:var(--pink-l);border-color:var(--pink)}
.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:0;list-style:none;margin:12px 0}
.vocab li{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.vocab .e{font-size:1.8rem}
.vocab .es{display:block;color:var(--pink-d);font-weight:800;font-size:.9rem}
.keybox{background:#fffbe6;border:3px dashed #f0c64a;border-radius:18px;padding:12px 16px;margin:12px 0}
.keybox ul{margin:6px 0 0;padding-left:22px}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.lvl{font-weight:900;color:var(--pink-d);text-transform:uppercase;font-size:.85rem;letter-spacing:.06em}
.qtext{font-size:1.3rem;font-weight:800;margin:6px 0 14px}
.opts{border:0;padding:0;margin:0;display:grid;gap:10px}
.opt{display:block;position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;gap:12px;align-items:center;padding:12px 16px;min-height:52px;background:#fff;border:3px solid var(--line);border-radius:18px;font-weight:700}
.opt span:before{content:"";flex:none;width:22px;height:22px;border-radius:50%;border:3px solid var(--blue);background:#fff}
.opt input:checked+span{border-color:var(--blue);background:var(--blue-l)}
.opt input:checked+span:before{background:var(--blue);box-shadow:inset 0 0 0 4px #fff}
.opt input:focus-visible+span{outline:4px solid #ff7aa8;outline-offset:3px}
.opt.ok span{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad span{border-color:var(--bad);background:var(--bad-bg)}
.opt input:disabled{cursor:default}
.mark{margin-left:auto;font-weight:900;white-space:nowrap}
.ok .mark{color:var(--ok)} .bad .mark{color:var(--bad)}
.pair{display:grid;grid-template-columns:1fr;gap:6px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.pair.ok{border-color:var(--ok);background:var(--ok-bg)} .pair.bad{border-color:var(--bad);background:var(--bad-bg)}
.pair label,.pair .lbl{font-weight:800}
select{font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:3px solid var(--line);background:#fff;color:var(--ink);min-height:46px;width:100%}
.cats{display:flex;gap:10px;flex-wrap:wrap;border:0;margin:0;padding:0}
.cats .opt{flex:1;min-width:150px}
.orderlist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.orderlist li{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 12px;font-weight:700}
.orderlist li.ok{border-color:var(--ok);background:var(--ok-bg)} .orderlist li.bad{border-color:var(--bad);background:var(--bad-bg)}
.orderlist .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900}
.orderlist .t{flex:1}
.mv{font:inherit;font-weight:900;width:46px;height:46px;border-radius:14px;border:3px solid var(--blue);background:#fff;color:var(--blue-d);cursor:pointer}
.mv[disabled]{opacity:.35;cursor:not-allowed}
.hint{color:var(--ink-soft);font-size:.95rem;font-weight:700;margin:-6px 0 12px}
.fb{margin-top:16px;border-radius:18px;padding:14px 16px;border:3px solid;font-weight:700}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)} .fb.part{background:#fff6dc;border-color:#d79a00}
.fb h3{margin:0 0 4px}
.fb p{margin:.3em 0}
.fb .ans{font-weight:800}
/* results */
.big{font-size:3.4rem;font-weight:900;line-height:1}
.rubric{display:inline-block;padding:6px 18px;border-radius:999px;font-weight:900;background:var(--blue-l);border:3px solid var(--blue)}
.mastery{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
.mastery li{display:grid;grid-template-columns:minmax(150px,1fr) 2fr 70px;gap:10px;align-items:center;font-weight:700;font-size:.95rem}
.mastery .progress{height:12px}
.review{border-left:6px solid var(--pink);padding:8px 14px;background:#fff;border-radius:0 14px 14px 0;margin:10px 0}
/* audit */
.tablewrap{overflow-x:auto;border-radius:16px;border:2px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:620px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--blue-l);font-weight:900;position:sticky;top:0}
td.c{text-align:center;font-weight:800}
.st-ok{color:var(--ok);font-weight:900} .st-bad{color:var(--bad);font-weight:900}
footer{padding-top:8px;padding-bottom:40px;color:var(--ink-soft);font-size:.9rem;text-align:center}
footer button{background:none;border:0;font:inherit;color:var(--blue-d);text-decoration:underline;font-weight:800;cursor:pointer;padding:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){
  body{font-size:17px}
  .bubble:before{display:none}
  .mastery li{grid-template-columns:1fr 60px}.mastery li .progress{grid-column:1/-1;order:3}
  .countdown{margin-left:0}
}
@media print{.sky,header.top,footer,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<div class="sky" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <span class="star" style="top:14%;left:78%">✦</span><span class="star" style="top:46%;left:6%;animation-delay:-1s">✧</span>
  <span class="star" style="top:80%;left:88%;animation-delay:-2s">✦</span><span class="star" style="top:24%;left:30%;animation-delay:-.5s;font-size:15px">✧</span>
</div>

<header class="top">
  <button class="brand" id="homeBtn" aria-label="Go to home">
    <svg id="logo" viewBox="0 0 120 120" aria-hidden="true"></svg>
    <span><b>Cloud Quest</b><small>Science · 3rd grade · Quiz 2</small></span>
  </button>
  <div class="countdown" id="countdown" role="status"></div>
</header>

<main id="app" tabindex="-1"></main>

<footer>
  <p>Practice based on the official topic list: Science, 3rd grade, Teacher Ximena Ramírez Solano · Quiz 2, II semester · Wednesday, October 7th, 2026.</p>
  <button id="auditBtn">Teacher / family: coverage audit</button>
  <button id="resetBtn">Reset my progress</button>
</footer>
<div class="sr" id="live" aria-live="polite"></div>

<script>
"use strict";
/* ============ SVG MASCOT (original cloud-puppy) ============ */
const mascot = (mood='happy') => `
<ellipse cx="20" cy="66" rx="15" ry="32" fill="#fff" stroke="#8fcaf7" stroke-width="3" transform="rotate(10 20 66)"/>
<ellipse cx="100" cy="66" rx="15" ry="32" fill="#fff" stroke="#8fcaf7" stroke-width="3" transform="rotate(-10 100 66)"/>
<circle cx="60" cy="60" r="38" fill="#fff" stroke="#8fcaf7" stroke-width="3"/>
<path d="M48 24c4-9 10-9 12-3 3-8 11-6 12 3" fill="#fff" stroke="#8fcaf7" stroke-width="3" stroke-linecap="round"/>
${mood==='think'
 ? '<circle cx="46" cy="58" r="6" fill="#2f5f95"/><circle cx="74" cy="58" r="6" fill="#2f5f95"/><circle cx="48" cy="56" r="2" fill="#fff"/><circle cx="76" cy="56" r="2" fill="#fff"/>'
 : '<path d="M40 58q6-8 12 0M68 58q6-8 12 0" fill="none" stroke="#2f5f95" stroke-width="4" stroke-linecap="round"/>'}
<ellipse cx="36" cy="72" rx="8" ry="5" fill="#ffb3cf"/><ellipse cx="84" cy="72" rx="8" ry="5" fill="#ffb3cf"/>
<ellipse cx="60" cy="68" rx="4" ry="3" fill="#2f5f95"/>
<path d="M54 76q6 6 12 0" fill="none" stroke="#2f5f95" stroke-width="3" stroke-linecap="round"/>`;
document.getElementById('logo').innerHTML = mascot();

/* ============ SYLLABUS (from the PDF) ============ */
// Every item the PDF lists becomes a trackable "tag". The audit checks that each tag has questions.
const SYL = [
 {g:'Specific objectives', id:'ways',      t:'Describe ways in which climates can change', ref:'Lesson 2 · Textbook p.142'},
 {g:'Specific objectives', id:'global',    t:'Explain how the global climate is changing', ref:'Lesson 2 · Textbook p.142'},
 {g:'Specific objectives', id:'gh-effect', t:'Identify the greenhouse effect (trapping heat in Earth’s atmosphere)', ref:'Textbook p.144-145 · Video'},
 {g:'Specific objectives', id:'gh-warm',   t:'Explain how the greenhouse effect keeps Earth warm', ref:'Textbook p.144-145 · Video'},
 {g:'Specific objectives', id:'gh-gases',  t:'Identify greenhouse gases and recognize examples', ref:'Textbook p.144-145'},
 {g:'Specific objectives', id:'nat-hum',   t:'Distinguish between natural and human factors that contribute to climate change', ref:'Textbook p.146-147'},
 {g:'Global effects', id:'ext',     t:'Species extinction'},
 {g:'Global effects', id:'ice',     t:'Melting ice caps'},
 {g:'Global effects', id:'heat',    t:'Heatwaves'},
 {g:'Global effects', id:'sea',     t:'Sea level rise'},
 {g:'Global effects', id:'flood',   t:'Floods'},
 {g:'Global effects', id:'drought', t:'Droughts'},
 {g:'Global effects', id:'shortage',t:'Food and water shortages'},
 {g:'Global effects', id:'fire',    t:'Forest fires'},
 {g:'Global effects', id:'severe',  t:'Severe weather changes'},
 {g:'Global effects', id:'coral',   t:'Bleached coral reefs'},
 {g:'Greenhouse gases', id:'co2',   t:'Carbon dioxide'},
 {g:'Greenhouse gases', id:'vapor', t:'Water vapor'},
 {g:'Greenhouse gases', id:'ch4',   t:'Methane'},
 {g:'Natural factors', id:'volcano',   t:'Volcanic eruptions'},
 {g:'Natural factors', id:'solar',     t:'Changes in solar energy'},
 {g:'Natural factors', id:'natchange', t:'Natural changes in Earth’s climate'},
 {g:'Human factors', id:'fossil',   t:'Burning fossil fuels'},
 {g:'Human factors', id:'deforest', t:'Deforestation'},
 {g:'Human factors', id:'transport',t:'Gases from means of transportation'},
];
const LEVELS = {
 1:{name:'Level 1 · Knowledge',  short:'Know it',   desc:'Recognize and remember the key ideas, words and examples.'},
 2:{name:'Level 2 · Application',short:'Use it',    desc:'Use what you know in everyday situations and sequences.'},
 3:{name:'Level 3 · Analysis',   short:'Think it',  desc:'Explain causes and effects, check claims and solve problems.'},
};

/* ============ QUESTION BANK ============ */
const Q = [];
const mc  = (lv,tags,q,right,wrongs,why)=>Q.push({lv,tags,t:'mcq',q,opts:[right,...wrongs],why});
const tf  = (lv,tags,q,ans,why)=>Q.push({lv,tags,t:'tf',q,a:ans,why});
const mt  = (lv,tags,q,left,pairs,why,hint)=>Q.push({lv,tags,t:'match',q,pairs,why,hint});
const so  = (lv,tags,q,cats,items,why)=>Q.push({lv,tags,t:'sort',q,cats,items,why});
const od  = (lv,tags,q,items,why)=>Q.push({lv,tags,t:'order',q,items,why});

/* ---------- LEVEL 1 · KNOWLEDGE ---------- */
mc(1,['ways'],'Can Earth’s climate change?','Yes, climate can change in different ways',['No, climate never changes','Only on weekends','Only inside the ocean'],'Climate can change. Some changes are natural and some are caused by people.');
tf(1,['ways','nat-hum'],'Climate can change because of nature and also because of people.',true,'Both! Nature (like volcanoes and the Sun) and people (like burning fuels) can change climate.');
mc(1,['global'],'What is happening to Earth’s global climate today?','Earth is getting warmer',['Earth is getting colder everywhere','Nothing is changing','Earth is getting smaller'],'Scientists have measured that Earth’s average temperature is going up. This is called global warming and it is changing the global climate.');
tf(1,['global'],'Earth’s global climate is changing.',true,'Yes. Temperatures are rising, ice is melting and the weather is changing in many places.');
mt(1,['heat','drought','flood','fire','sea'],'Match each global effect with its meaning.',null,[
 ['Heatwave','Many days of very hot weather'],
 ['Drought','A long time with very little rain'],
 ['Flood','Too much water covers dry land'],
 ['Forest fire','Fire that burns trees and wild land'],
 ['Sea level rise','Ocean water gets higher along the coast']],
 'These are effects of a warming Earth. Heatwaves are hot, droughts are dry, floods are wet, forest fires burn, and the sea level rises.');
mt(1,['ext','ice','coral','shortage','severe'],'Match each global effect with its meaning.',null,[
 ['Species extinction','A kind of plant or animal disappears forever'],
 ['Melting ice caps','Ice at the poles turns into water'],
 ['Bleached coral reefs','Corals lose their color and are in danger'],
 ['Food and water shortages','There is not enough food or clean water'],
 ['Severe weather changes','Stronger storms and unusual weather']],
 'Each one is a way a warmer Earth can hurt living things and people.');
mc(1,['gh-effect'],'What is the greenhouse effect?','Gases in the air trap heat and keep Earth warm',['A glass house built on the Moon','Wind that cools Earth down','Plants that grow only in gardens'],'The greenhouse effect is heat being trapped in Earth’s atmosphere by certain gases.');
tf(1,['gh-effect'],'The greenhouse effect happens in Earth’s atmosphere.',true,'The atmosphere is the blanket of air around Earth. The greenhouse gases in it trap heat.');
mc(1,['gh-warm'],'What do greenhouse gases do with the Sun’s heat?','They trap some of it near Earth',['They send all of it back to space','They turn it into rain','They make it disappear'],'Greenhouse gases hold some heat close to Earth, like a blanket, so Earth stays warm.');
tf(1,['gh-warm'],'Without any greenhouse effect, Earth would be much colder.',true,'A natural greenhouse effect keeps Earth warm enough for life. Problems start when there is too much greenhouse gas.');
mc(1,['gh-gases','co2'],'Which of these is a greenhouse gas?','Carbon dioxide',['Oxygen','Nitrogen','Helium'],'Carbon dioxide (CO₂) is a greenhouse gas. The other three are not greenhouse gases.');
mt(1,['co2','vapor','ch4','gh-gases'],'Match each greenhouse gas with an example.',null,[
 ['Carbon dioxide','Comes out of cars when they burn fuel'],
 ['Methane','Comes from cows, farms and garbage dumps'],
 ['Water vapor','Water that rises into the air as a gas']],
 'The three greenhouse gases to remember are carbon dioxide, water vapor and methane.');
mc(1,['vapor','gh-gases'],'What is water vapor?','Water in the form of a gas',['Ice in the freezer','Rain falling from a cloud','Snow on a mountain'],'Water vapor is water as an invisible gas in the air. It is a greenhouse gas.');
mc(1,['ch4','gh-gases'],'Which greenhouse gas comes from cows, farms and garbage dumps?','Methane',['Oxygen','Helium','Nitrogen'],'Methane (CH₄) is a greenhouse gas released by cows, farms and rotting garbage.');
mc(1,['nat-hum','volcano'],'Which factor is NATURAL?','A volcanic eruption',['Burning coal','Cutting down forests','Smoke from cars'],'Volcanoes erupt without help from people, so they are a natural factor.');
mc(1,['nat-hum','fossil'],'Which factor is caused by HUMANS?','Burning fossil fuels',['A volcanic eruption','Changes in the Sun’s energy','Natural changes in Earth’s climate'],'People burn coal, oil and natural gas for energy. That is a human factor.');
so(1,['nat-hum','volcano','solar','natchange','fossil','deforest','transport'],'Is each factor natural or human?',['Natural','Human'],[
 ['Volcanic eruptions',0],['Burning fossil fuels',1],['Deforestation',1],['Changes in the Sun’s energy',0],['Gases from cars, buses and planes',1],['Natural changes in Earth’s climate',0]],
 'Natural: volcanoes, the Sun’s energy, natural climate changes. Human: burning fossil fuels, deforestation and gases from transportation.');
mc(1,['fossil'],'Which of these are fossil fuels?','Coal, oil and natural gas',['Wind, water and sunlight','Sand, rocks and soil','Leaves, grass and flowers'],'Coal, oil and natural gas come from ancient plants and animals. Burning them releases carbon dioxide.');

/* ---------- QUIZ ENGINE ---------- */
let S=null;
function buildMock(){
  const need=new Set(SYL.map(s=>s.id)); const chosen=[]; let pool=shuffle(Q);
  while(need.size){
    let best=null,bs=0;
    for(const q of pool){ if(chosen.includes(q)) continue; const c=q.tags.filter(t=>need.has(t)).length; if(c>bs){bs=c;best=q;} }
    if(!best) break; chosen.push(best); best.tags.forEach(t=>need.delete(t));
  }
  for(const q of pool){ if(chosen.length>=22) break; if(!chosen.includes(q)) chosen.push(q); }
  return chosen.sort((a,b)=>a.lv-b.lv);
}
function startQuiz(kind){
  const qs = kind==='mock' ? buildMock() : shuffle(Q.filter(q=>q.lv===+kind[1]));
  S={kind,qs,i:0,pts:0,log:[]};
  go(viewQuestion);
}

    <h2 class="qtext" id="qt" tabindex="-1" style="margin-top:16px">${esc(q.q)}</h2>
    <form id="qf" novalidate></form>
    <div id="fb" aria-live="polite"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="check" type="button">Check my answer</button>
      <button class="btn pink" id="next" type="button" hidden>${S.i===n-1?'See my results':'Next question →'}</button>
      <button class="btn alt" id="quit" type="button">Exit</button>

  </section></div>`;
  const f=$('#qf'), r=RENDER[q.t](q,f);
  $('#check').onclick=()=>{
    const res=r.check(); if(res==null) return;
    S.pts+=res.frac; S.log.push({q,frac:res.frac});
    $('#check').hidden=true; $('#next').hidden=false; $('#next').focus();
    const cls=res.frac===1?'ok':res.frac>0?'part':'bad';
    const head=res.frac===1?'✅ Correct! Great job!':res.frac>0?`🟡 Almost! You got ${Math.round(res.frac*100)}% of this one.`:'💡 Not quite, but now you know!';
    $('#fb').innerHTML=`<div class="fb ${cls}"><h3>${head}</h3>${res.detail?`<p class="ans">${res.detail}</p>`:''}<p><b>Why?</b> ${esc(q.why)}</p></div>`;
    live(head.replace(/[^\w !%.,]/g,''));
  };
  $('#next').onclick=()=>{ S.i++; S.i<n? go(viewQuestion) : go(viewResults); };
  $('#quit').onclick=()=>{ if(confirm('Leave this practice? Your answers in this round will not be saved.')) go(viewHome); };
  $('#qt').focus({preventScroll:true});
}

const RENDER = {
  mcq(q,f){
    const opts=shuffle(q.opts.map((t,i)=>({t,ok:i===0})));
    return choice(f,opts,'Choose one answer');
  },
  tf(q,f){
    return choice(f,[{t:'True',ok:q.a===true},{t:'False',ok:q.a===false}],'True or false');
  },
  match(q,f){
    const rights=shuffle(q.pairs.map(p=>p[1]));
    f.innerHTML=`<p class="hint">For each item, choose the correct match from the list.</p>`+q.pairs.map((p,i)=>`
      <div class="pair" data-i="${i}"><label for="m${i}">${esc(p[0])}</label>
      <select id="m${i}"><option value="">Choose…</option>${rights.map(r=>`<option>${esc(r)}</option>`).join('')}</select><span class="mk"></span></div>`).join('');
    return {check(){
      const sel=[...f.querySelectorAll('select')];
      if(sel.some(s=>!s.value)){ live('Please answer every item first.'); sel.find(s=>!s.value).focus(); return null; }
      let ok=0, wrong=[];
      sel.forEach((s,i)=>{const good=s.value===q.pairs[i][1]; const box=s.closest('.pair');
        box.classList.add(good?'ok':'bad'); box.querySelector('.mk').innerHTML=good?'<b class="st-ok">✓ Correct</b>':`<b class="st-bad">✗ Correct match: ${esc(q.pairs[i][1])}</b>`;
        s.disabled=true; good?ok++:wrong.push(i);});
      return {frac:ok/q.pairs.length, detail:ok===q.pairs.length?'':`${ok} of ${q.pairs.length} matches correct.`};
    }};
  },
  sort(q,f){
    f.innerHTML=`<p class="hint">Choose one group for each item.</p>`+q.items.map((it,i)=>`
      <div class="pair" data-i="${i}"><span class="lbl" id="sl${i}">${esc(it[0])}</span>
      <fieldset class="cats" aria-labelledby="sl${i}">${q.cats.map((c,j)=>`<label class="opt"><input type="radio" name="s${i}" value="${j}"><span>${esc(c)}</span></label>`).join('')}</fieldset><span class="mk"></span></div>`).join('');
    return {check(){
      const missing=q.items.findIndex((_,i)=>!f.querySelector(`input[name=s${i}]:checked`));
      if(missing>=0){ live('Please answer every item first.'); f.querySelector(`input[name=s${missing}]`).focus(); return null; }
      let ok=0;
      q.items.forEach((it,i)=>{const v=+f.querySelector(`input[name=s${i}]:checked`).value; const good=v===it[1]; const box=f.querySelector(`.pair[data-i="${i}"]`);
        box.classList.add(good?'ok':'bad'); box.querySelector('.mk').innerHTML=good?'<b class="st-ok">✓ Correct</b>':`<b class="st-bad">✗ It belongs to: ${esc(q.cats[it[1]])}</b>`;
        box.querySelectorAll('input').forEach(x=>x.disabled=true); if(good)ok++;});
      return {frac:ok/q.items.length, detail:ok===q.items.length?'':`${ok} of ${q.items.length} correct.`};
    }};
  },
  order(q,f){
    let arr=shuffle(q.items); if(arr.join()===q.items.join()) arr=arr.slice().reverse();
    let locked=false;
    const draw=(focusIdx)=>{
      f.innerHTML=`<p class="hint">Use the ↑ and ↓ buttons to put the steps in the right order (first at the top).</p><ol class="orderlist">${arr.map((t,i)=>`
       <li data-i="${i}"><span class="n" aria-hidden="true">${i+1}</span><span class="t">${esc(t)}</span>
       <button type="button" class="mv" data-d="-1" aria-label="Move up: ${esc(t)}" ${i===0||locked?'disabled':''}>↑</button>
       <button type="button" class="mv" data-d="1" aria-label="Move down: ${esc(t)}" ${i===arr.length-1||locked?'disabled':''}>↓</button></li>`).join('')}</ol>`;
      f.querySelectorAll('.mv').forEach(b=>b.onclick=()=>{
        const i=+b.closest('li').dataset.i, d=+b.dataset.d; [arr[i],arr[i+d]]=[arr[i+d],arr[i]];
        draw(); const nb=f.querySelector(`li[data-i="${i+d}"] .mv[data-d="${d}"]`)||f.querySelector(`li[data-i="${i+d}"] .mv:not([disabled])`); nb&&nb.focus();
        live(`Moved to position ${i+d+1} of ${arr.length}`);
      });
    };
    draw();
    return {check(){
      locked=true; let ok=0;
      arr.forEach((t,i)=>{ if(t===q.items[i]) ok++; });
      draw();
      f.querySelectorAll('li').forEach((li,i)=>{const good=arr[i]===q.items[i]; li.classList.add(good?'ok':'bad'); li.insertAdjacentHTML('beforeend',good?'<b class="st-ok">✓</b>':'<b class="st-bad">✗</b>');});
      f.insertAdjacentHTML('beforeend',`<p class="hint" style="margin-top:12px"><b>Correct order:</b> ${q.items.map((t,i)=>`${i+1}) ${esc(t)}`).join(' → ')}</p>`);
      return {frac:ok/arr.length, detail:ok===arr.length?'':`${ok} of ${arr.length} steps were in the right place.`};
    }};
  }
};
function choice(f,opts,legend){
  f.innerHTML=`<fieldset class="opts"><legend class="sr">${legend}</legend>${opts.map((o,i)=>`
   <label class="opt"><input type="radio" name="c" value="${i}"><span>${esc(o.t)}<b class="mark"></b></span></label>`).join('')}</fieldset>`;
  return {check(){
    const sel=f.querySelector('input:checked');
    if(!sel){ live('Please choose an answer first.'); f.querySelector('input').focus(); return null; }
    const i=+sel.value, good=opts[i].ok;
    f.querySelectorAll('.opt').forEach((l,j)=>{
      const inp=l.querySelector('input'); inp.disabled=true;
      if(opts[j].ok){ l.classList.add('ok'); l.querySelector('.mark').textContent=j===i?'✓ Your answer':'✓ Correct answer'; }
      else if(j===i){ l.classList.add('bad'); l.querySelector('.mark').textContent='✗ Your answer'; }
    });
    return {frac:good?1:0, detail:good?'':`The correct answer is: ${esc(opts.find(o=>o.ok).t)}`};
  }};
}

function viewResults(){
  const n=S.qs.length, pct=Math.round(S.pts/n*100), rb=rubric(pct), st=starsFor(pct);
  const store0=store.get(); if(store0[S.kind]==null||pct>store0[S.kind]){store0[S.kind]=pct;store.set(store0);}
  // mastery per tag (only tags seen in this round)
  const m={}; S.log.forEach(l=>l.q.tags.forEach(t=>{(m[t]=m[t]||{p:0,n:0});m[t].p+=l.frac;m[t].n++;}));
  const rows=Object.keys(m).sort((a,b)=>SYL.findIndex(s=>s.id===a)-SYL.findIndex(s=>s.id===b)).map(t=>{const v=Math.round(m[t].p/m[t].n*100);
    return `<li><span>${esc(tagLabel(t))}</span><div class="progress" role="img" aria-label="${v} percent"><i style="width:${v}%"></i></div><span>${v}% ${v>=80?'✅':'📚'}</span></li>`;});
  const missed=S.log.filter(l=>l.frac<1);
  const next = S.kind==='l1'?['l2','Go to Level 2']:S.kind==='l2'?['l3','Go to Level 3']:S.kind==='l3'?['mock','Take the mock quiz']:null;
  app.innerHTML=`
  <div class="stack">
   <section class="card" style="text-align:center">
     <svg viewBox="0 0 120 120" width="110" height="110" aria-hidden="true">${mascot(pct>=70?'happy':'think')}</svg>
     <p class="big">${pct}%</p>
     <p>${starHtml(st)}</p>
     <p><span class="rubric">${rb.e} ${rb.n}</span></p>
     <p>${rb.m}</p>
     <p class="hint">Performance levels are an estimate. Your teacher’s official scale may differ slightly.</p>
     <div class="row" style="justify-content:center">
       <button class="btn" id="again">Try again</button>
       ${next?`<button class="btn pink" id="nxt">${next[1]}</button>`:''}
       <button class="btn alt" id="home">Back to path</button>
     </div>
   </section>
   <section class="card"><h2>Mastery by topic</h2><ul class="mastery">${rows.join('')}</ul>
     <p class="hint">✅ 80% or more · 📚 keep practicing. Re-read the lesson card for that topic.</p></section>
   ${missed.length?`<section class="card"><h2>Let’s review (${missed.length})</h2>${missed.map(l=>`<div class="review"><b>${esc(l.q.q)}</b><br>${esc(l.q.why)}</div>`).join('')}</section>`:'<section class="card"><h2>Perfect round! 🎉</h2><p>No mistakes to review.</p></section>'}
  </div>`;
  $('#again').onclick=()=>startQuiz(S.kind);
  if(next) $('#nxt').onclick=()=>startQuiz(next[0]);
  $('#home').onclick=()=>go(viewHome);
}

/* ---------- AUDIT ---------- */
function viewAudit(){
  const groups=[...new Set(SYL.map(s=>s.g))];
  let gaps=0;
  const rowsOf=g=>SYL.filter(s=>s.g===g).map(s=>{
    const c=[1,2,3].map(l=>Q.filter(q=>q.lv===l&&q.tags.includes(s.id)).length);
    const tot=c[0]+c[1]+c[2], lv=c.filter(Boolean).length, ok=tot>=3&&lv>=2; if(!ok)gaps++;
    return `<tr><td>${esc(s.t)}${s.ref?`<br><small>${esc(s.ref)}</small>`:''}</td><td class="c">${c[0]}</td><td class="c">${c[1]}</td><td class="c">${c[2]}</td><td class="c">${tot}</td><td class="${ok?'st-ok':'st-bad'}">${ok?'✓ Covered':'✗ GAP'}</td></tr>`;
  }).join('');
  const types={}; Q.forEach(q=>types[q.t]=(types[q.t]||0)+1);
  app.innerHTML=`
  <div class="stack">
   <h1>Coverage audit</h1>
   <section class="card">
     <p>This table is generated live from the question bank. Every item of the official list (objectives, global effects, gases and factors) must have at least <b>3 questions</b> and appear in <b>at least 2 levels</b>.</p>
     <p><b>${SYL.length}</b> syllabus items · <b>${Q.length}</b> questions · Level 1: <b>${Q.filter(q=>q.lv===1).length}</b>, Level 2: <b>${Q.filter(q=>q.lv===2).length}</b>, Level 3: <b>${Q.filter(q=>q.lv===3).length}</b> ·
        Question types: ${Object.entries(types).map(([k,v])=>`${k} ${v}`).join(', ')}</p>
     <p class="${gaps?'st-bad':'st-ok'}" role="status">${gaps?`✗ ${gaps} item(s) with gaps`:'✓ No gaps: every topic on the list is covered'}</p>
     <p>The final mock quiz is built automatically so it contains at least one question for every item in this table.</p>
   </section>
   ${groups.map(g=>`<section class="card"><h2>${esc(g)}</h2><div class="tablewrap" tabindex="0" role="region" aria-label="${esc(g)} coverage table"><table><thead><tr><th scope="col">Item (PDF)</th><th scope="col">L1</th><th scope="col">L2</th><th scope="col">L3</th><th scope="col">Total</th><th scope="col">Status</th></tr></thead><tbody>${rowsOf(g)}</tbody></table></div></section>`).join('')}
   <section class="card"><h2>Notes for the teacher / family</h2><ul>
     <li>Reference materials: notebook, handouts, practices, textbook p.142, 144-147 and the video “A Breathing Planet, Off Balance”. The video’s exact content was not available, so questions follow the topic list. Please add any video-specific details.</li>
     <li>Progression follows Bloom: Level 1 remember/understand, Level 2 apply, Level 3 analyze/evaluate.</li>
     <li>Feedback is explanatory for both right and wrong answers. Score bands (90/80/70) approximate a typical private-school rubric.</li>
   </ul><button class="btn alt noprint" onclick="window.print()">Print this audit</button></section>
  </div>`;
}

$('#homeBtn').onclick=()=>go(viewHome);
$('#auditBtn').onclick=()=>go(viewAudit);
$('#resetBtn').onclick=()=>{ if(confirm('Delete all saved progress on this device?')){ store.clear(); go(viewHome); } };
setCountdown();
viewHome();
</script>
